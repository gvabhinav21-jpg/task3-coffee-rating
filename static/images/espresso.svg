<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="coffee-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d2314"/>
      <stop offset="100%" stop-color="#1b0e07"/>
    </linearGradient>
    <linearGradient id="cup-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background soft circle -->
  <circle cx="50" cy="50" r="45" fill="#3d2314" fill-opacity="0.08"/>
  
  <!-- Steam -->
  <path d="M43,30 Q40,20 46,12 T40,5" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 1" opacity="0.6"/>
  <path d="M50,30 Q47,22 53,15 T48,6" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 1" opacity="0.75"/>
  <path d="M57,32 Q54,24 60,18 T55,8" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 1" opacity="0.6"/>
  
  <!-- Saucer -->
  <ellipse cx="50" cy="78" rx="30" ry="8" fill="url(#cup-grad)"/>
  <ellipse cx="50" cy="77" rx="25" ry="6" fill="#94a3b8" opacity="0.3"/>

  <!-- Cup Handle -->
  <path d="M68,52 C78,52 78,68 68,68" fill="none" stroke="url(#cup-grad)" stroke-width="6.5"/>
  
  <!-- Cup Body -->
  <path d="M30,45 C30,68 33,74 50,74 C67,74 70,68 70,45 Z" fill="url(#cup-grad)"/>
  
  <!-- Coffee Liquid -->
  <ellipse cx="50" cy="45" rx="19" ry="4" fill="url(#coffee-grad)"/>
  
  <!-- Crema -->
  <ellipse cx="48" cy="45" rx="15" ry="2.8" fill="#d97706" opacity="0.75"/>
</svg>
