<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="irish-coffee" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1005"/>
      <stop offset="100%" stop-color="#140602"/>
    </linearGradient>
    <linearGradient id="stem-glass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  <!-- Background soft circle -->
  <circle cx="50" cy="50" r="45" fill="#140602" fill-opacity="0.08"/>

  <!-- Base of stemmed glass -->
  <ellipse cx="50" cy="85" rx="16" ry="3.5" fill="url(#stem-glass)" stroke="rgba(255,255,255,0.2)" stroke-width="0.8"/>
  <!-- Stem -->
  <rect x="48.5" y="66" width="3" height="18" fill="url(#stem-glass)"/>

  <!-- Bowl of stemmed glass -->
  <!-- Coffee inside -->
  <path d="M34,36 C34,60 40,68 50,68 C60,68 66,60 66,36 Z" fill="url(#irish-coffee)"/>
  
  <!-- Thick Cream Layer -->
  <ellipse cx="50" cy="36" rx="16" ry="3.5" fill="#f8fafc"/>
  <path d="M34,36 C34,40 37,42 50,42 C63,42 66,40 66,36 Z" fill="#f8fafc"/>

  <!-- Glass Bowl Outer Outline -->
  <path d="M34,30 C34,60 40,68 50,68 C60,68 66,60 66,30 Z" fill="url(#stem-glass)" stroke="rgba(255,255,255,0.25)" stroke-width="1.2"/>

  <!-- Rim -->
  <ellipse cx="50" cy="30" rx="16.3" ry="3" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.2"/>
</svg>
